root /var/www/portfolio/october-sandbox;

add_header X-Frame-Options "SAMEORIGIN";
add_header X-Content-Type-Options "nosniff";

index index.php;

charset utf-8;

merge_slashes off;

rewrite ^(.*?)//+(.*?)$ $1/$2 permanent;
rewrite ^/index\.php(/.*)$ $1 permanent;

# The document root is the project root, so a file is served as is only when
# allow-list.conf names its path; everything else goes to October. Serving any
# existing file handed out auth.json, composer.lock, storage/logs and the PHP
# sources as plain text.
location / {
    rewrite ^/.*$ /index.php last;
}

location = /favicon.ico { access_log off; log_not_found off; }
location = /robots.txt  { access_log off; log_not_found off; }

error_page 404 /index.php;

location ~ ^/index.php {
    fastcgi_pass php-fpm:9000;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    include fastcgi_params;
    fastcgi_index index.php;
}

include snippets/allow-list.conf;
