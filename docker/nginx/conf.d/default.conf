fastcgi_buffers 16 16k;
fastcgi_buffer_size 32k;
fastcgi_busy_buffers_size 64k;

large_client_header_buffers 8 32k;

client_max_body_size 64m;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    include snippets/common.conf;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    include snippets/ssl-certificate.conf;
    include snippets/common.conf;
}
