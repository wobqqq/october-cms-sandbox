name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  php:
    name: PHP checks without the October modules
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none
          tools: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-all

      - name: Install everything but the licensed October modules
        run: |
          composer config --unset repositories.octobercms
          composer remove october/all october/backend october/cms october/dashboard october/editor october/media october/system october/tailor --no-scripts --no-interaction --no-progress

      - name: Audit the dependencies
        run: composer audit --abandoned=report

      - name: Code style
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: YAML
        run: vendor/bin/yaml-lint docker-compose.yaml themes/sandbox/theme.yaml

  syntax:
    name: PHP syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none
          tools: none

      - name: Lint every PHP file
        run: find app bootstrap config tests -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

  workflows:
    name: Workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint the GitHub workflows
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
